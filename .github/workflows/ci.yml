name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Zenmanage.sln

      - name: Build
        run: dotnet build Zenmanage.sln -c Release --no-restore

      - name: Test with Coverage
        run: dotnet test tests/Zenmanage.Tests/Zenmanage.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Pack (Validation)
        run: dotnet pack Zenmanage.sln -c Release --no-build -o artifacts

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-preview
          path: artifacts/*
